# 前端 CI：安装依赖、单元测试、类型检查与构建
name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-ci:
    name: Web - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 固定与本地开发一致的版本，避免 latest 漂移导致 lockfile 校验差异
          version: 10.32.1

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm --version && pnpm install --frozen-lockfile

      - name: 单元测试
        run: pnpm test

      - name: 类型检查与构建
        run: pnpm build
